name: AWS - Terraform backend (S3) bootstrap

# Creates/maintains the S3 bucket that stores Terraform state for every AWS stack.
# Handles three situations automatically:
#   1. bucket does not exist             -> create with local state, then migrate state into the bucket
#   2. bucket exists, no bootstrap state -> import the bucket into Terraform (import blocks)
#   3. bucket and bootstrap state exist  -> normal plan/apply (drift correction, setting changes)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        type: choice
        options: [plan, apply]
        default: plan
  pull_request:
    paths:
      - "aws/bootstrap/**"
      - ".github/workflows/aws-tf-backend-bootstrap.yml"

permissions:
  id-token: write # GitHub OIDC -> AWS, no long-lived keys
  contents: read

concurrency:
  group: aws-tf-backend-bootstrap
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.2"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  STATE_KEY: bootstrap/terraform.tfstate
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'apply' && 'aws-prod' || '' }}
    defaults:
      run:
        working-directory: aws/bootstrap

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Detect bucket / state status
        id: detect
        run: |
          set +e
          out=$(aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>&1); rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            bucket_exists=true
          elif echo "$out" | grep -q "404"; then
            bucket_exists=false
          else
            echo "::error::Cannot access bucket $TF_STATE_BUCKET (owned by another account or no permission): $out"
            exit 1
          fi

          state_exists=false
          if [ "$bucket_exists" = true ] && \
             aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$STATE_KEY" >/dev/null 2>&1; then
            state_exists=true
          fi

          echo "bucket_exists=$bucket_exists" >> "$GITHUB_OUTPUT"
          echo "state_exists=$state_exists"   >> "$GITHUB_OUTPUT"
          echo "Bucket exists: $bucket_exists, bootstrap state exists: $state_exists"

      # ---- Case 1: bucket missing -> local backend for the first run ----
      - name: Init (local backend, bucket not created yet)
        if: steps.detect.outputs.bucket_exists == 'false'
        run: |
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init

      # ---- Case 2/3: bucket exists -> S3 backend ----
      - name: Init (S3 backend)
        if: steps.detect.outputs.bucket_exists == 'true'
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Enable import of existing bucket
        if: steps.detect.outputs.bucket_exists == 'true' && steps.detect.outputs.state_exists == 'false'
        run: echo "TF_VAR_import_existing_bucket=true" >> "$GITHUB_ENV"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply tfplan

      - name: Migrate local state into the new bucket
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && steps.detect.outputs.bucket_exists == 'false'
        run: |
          rm -f backend_override.tf
          terraform init -migrate-state -force-copy \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$STATE_KEY" >/dev/null
          echo "Bootstrap state now stored at s3://$TF_STATE_BUCKET/$STATE_KEY"
