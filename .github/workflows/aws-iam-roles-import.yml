name: AWS - Import existing IAM roles

# PR            -> fmt / validate / plan (shows which roles "will be imported")
# push to main  -> plan + apply (imports roles into the S3 state), gated by the aws-prod environment
# manual run    -> choose plan or apply

on:
  pull_request:
    paths:
      - "aws/iam-roles/**"
      - ".github/workflows/aws-iam-roles-import.yml"
  push:
    branches: [main]
    paths:
      - "aws/iam-roles/**"
      - ".github/workflows/aws-iam-roles-import.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-iam-roles # never run two applies against the same state
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.2"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' || inputs.action == 'apply') && 'aws-prod' || '' }}
    defaults:
      run:
        working-directory: aws/iam-roles

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (S3 backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      # An import should only ADD resources to state. If the config does not match the
      # live role, Terraform would change or even replace it -- stop before that happens.
      - name: Check plan is import-only
        run: |
          terraform show -json tfplan > plan.json

          imports=$(jq '[.resource_changes[]? | select(.change.importing)] | length' plan.json)
          creates=$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' plan.json)
          updates=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' plan.json)
          destroys=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address' plan.json)

          {
            echo "### Terraform plan - IAM roles"
            echo "| Imports | Creates | Updates |"
            echo "|---|---|---|"
            echo "| $imports | $creates | $updates |"
            echo
            echo '```'
            terraform show -no-color tfplan | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$creates" != "0" ] || [ "$updates" != "0" ]; then
            echo "::warning::Plan has $creates create(s) and $updates update(s) besides imports. Check roles.auto.tfvars.json matches the live roles (aws/scripts/discover-roles.sh)."
          fi
          if [ -n "$destroys" ]; then
            echo "::error::Plan would delete or replace resources:"
            echo "$destroys"
            exit 1
          fi

      - name: Terraform apply
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform apply tfplan

      - name: Show managed resources
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform state list
